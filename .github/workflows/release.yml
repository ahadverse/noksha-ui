name: Release

# Changesets are kept out of the repository, so a CI checkout has no
# .changeset directory to act on — releasing is a local command:
#   pnpm version-packages && pnpm release
# This stays here, manual-only, for if the notes are ever tracked again.
on:
  workflow_dispatch:

concurrency: release

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20.11
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      # Either opens/updates the "Version Packages" PR, or — when that PR has
      # been merged and changesets are pending consumption — publishes. The
      # build runs inside `publish` (see the root `release` script), so nothing
      # can be published from a stale or missing dist.
      - uses: changesets/action@v1
        with:
          version: pnpm version-packages
          publish: pnpm release
          commit: 'chore: version packages'
          title: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          # Add `NPM_CONFIG_PROVENANCE: true` once the first release is out and
          # the repository URL on npm matches this repo — see RELEASING.md.
